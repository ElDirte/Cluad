version: "3.8"

# The System — Full Stack
# Start everything:  docker-compose up -d
# Stop everything:   docker-compose down
# Move to new PC:    bash scripts/export-stack.sh → copy folder → bash scripts/import-stack.sh

services:

  # ── Your pipeline API ─────────────────────────────────────────────
  brain-api:
    build: .
    container_name: brain-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - VAULT_ROOT=/data/vault
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_URL=http://host.docker.internal:11434
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-changeme}
      - NOTION_TOKEN=${NOTION_TOKEN:-}
      - NOTION_DATABASE_ID=${NOTION_DATABASE_ID:-}
    volumes:
      - vault_data:/data/vault
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - neo4j

  # ── Automation scheduler ──────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: brain-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Chicago
      - TZ=America/Chicago
    volumes:
      - n8n_data:/home/node/.n8n
      - ./setup/n8n_workflows:/data/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Graph database ────────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: brain-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-changeme}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  # Ollama runs natively on Windows — no container needed.
  # brain-api and vault scripts reach it via host.docker.internal:11434

volumes:
  vault_data:
  n8n_data:
  neo4j_data:
  neo4j_logs:
